backend:
  name: github
  repo: endcode07/blog-seo
  branch: main
  base_url: https://reviewdigital.netlify.app
  auth_endpoint: api/auth

media_folder: "src/assets/images"
public_folder: "../../assets/images"

collections:
  - name: "blog"
    label: "Artikel"
    folder: "src/content/blog"
    create: true
    extension: "md"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Meta Description", name: "description", widget: "text", hint: "Max 160 aksara" }
      - { label: "Tarikh", name: "pubDate", widget: "datetime" }
      - { label: "Keyword", name: "keyword", widget: "string", required: false }
      - { label: "Gambar Utama", name: "heroImage", widget: "image", required: false }
      - { label: "Isi", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Halaman"
    files:
      - label: "Home"
        name: "home"
        file: "src/data/home.md"
        fields:
          - { label: "Title (tab browser)", name: "title", widget: "string" }
          - { label: "Meta Description", name: "description", widget: "text" }
          - { label: "Tajuk Besar", name: "heading", widget: "string" }
          - { label: "Isi", name: "body", widget: "markdown" }
      - label: "About"
        name: "about"
        file: "src/data/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Meta Description", name: "description", widget: "text" }
          - { label: "Isi", name: "body", widget: "markdown" }
